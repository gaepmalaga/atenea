# Las guardas de `tests/` solo sirven si corren solas. Varias de ellas leen el
# código fuente y fallan si vuelve un patrón peligroso (un userId por parámetro,
# un upsert que expande el objeto del cliente, una conversión con `Number()`);
# tenerlas dependiendo de que alguien se acuerde de ejecutarlas es lo mismo que
# no tenerlas.
name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + tests. No necesita Supabase ni Gemini: todo lo que se prueba
      # es lógica pura o lectura estática del código.
      - run: npm run check

      # EL BUILD SÍ ESTÁ, y con variables de mentira.
      #
      # Aquí ponía que no se podía porque `core.ts` construye los clientes al
      # importarse y el prerender exigía "las cuatro variables reales".
      # Comprobado: exige que EXISTAN, no que sirvan. Con cuatro valores
      # inventados el build pasa entero.
      #
      # Importa porque cada push a `main` despliega solo en Vercel: sin esto, un
      # fallo que solo aparece en el build de producción —un `import` que no
      # resuelve, un tipo que `next build` comprueba y `tsc` no— llega a
      # producción y la plataforma se queda caída hasta que alguien la abre.
      # `npm run check` no lo ve: no compila la aplicación.
      #
      # No se conecta a nada: `next build` prerenderiza HTML, no hace consultas.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-solo-para-compilar
          SUPABASE_SERVICE_ROLE_KEY: placeholder-solo-para-compilar
          GEMINI_API_KEY: placeholder-solo-para-compilar

      # El lint todavía no es puerta de calidad: quedan errores heredados de la
      # fase 5. Se ejecuta para verlo, pero no tumba la ejecución.
      - run: npm run lint
        continue-on-error: true
