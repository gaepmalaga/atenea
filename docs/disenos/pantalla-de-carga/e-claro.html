<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantalla de carga · E · Claro</title>
<!-- Propuesta E, GUARDADA y sin usar (ver README.md de esta carpeta). Se abre
     tal cual en el navegador desde el repo: las imágenes salen de public/marca. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@700&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  .pantalla {
    min-height: 100dvh; box-sizing: border-box; position: relative; overflow: hidden;
    background: #f6f4ee; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: Inter, system-ui, sans-serif; color: #14295a;
  }
  .icono { position: relative; width: 116px; height: 116px; margin-top: -48px; border-radius: 30px;
    background: radial-gradient(90% 90% at 50% 40%, #0a4e72 0%, #123a6a 45%, #14295a 100%);
    box-shadow: 0 18px 40px rgba(20,41,90,.22), 0 2px 6px rgba(20,41,90,.18);
    display: flex; align-items: center; justify-content: center; }
  .a { position: relative; width: 68px; height: 70px; }
  .a img { width: 68px; height: 70px; display: block; object-fit: contain; }
  .destello { position: absolute; inset: 0;
    -webkit-mask-image: url(../../../public/marca/alphapol-isotipo.webp); mask-image: url(../../../public/marca/alphapol-isotipo.webp);
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    background: linear-gradient(105deg, rgba(255,250,230,0) 42%, rgba(255,250,230,.9) 50%, rgba(255,250,230,0) 58%);
    background-size: 300% 100%; background-repeat: no-repeat; background-position: 100% 0; }
  .nombre { margin: 36px 0 0; font-family: Montserrat, system-ui, sans-serif; font-size: 32px; font-weight: 700;
    letter-spacing: .08em; text-indent: .08em; line-height: 1; }
  /* Oscuro a propósito: el dorado del logo (#c5a738) sobre hueso no llega a 3:1. */
  .oro { background: linear-gradient(180deg, #b8962c 0%, #8a6d1a 100%); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: #8a6d1a; }
  .filete { width: 210px; height: 1px; margin-top: 12px; background: #d9d3c2; }
  .lema { margin: 10px 0 0; font-size: 10.5px; font-weight: 500; letter-spacing: .36em; text-indent: .36em; color: #5b6477; }
  .puntos { display: flex; gap: 7px; margin-top: 52px; }
  .puntos div { width: 7px; height: 7px; border-radius: 50%; background: #14295a; }
  .puntos div:last-child { background: #c5a738; }
  .estado { position: absolute; left: 0; right: 0; bottom: 56px; margin: 0; text-align: center;
    font-size: 13px; font-weight: 500; color: #5b6477; }

  .icono { animation: salta .9s cubic-bezier(.3,1.5,.5,1) both, respira 3s 1s ease-in-out infinite; }
  .nombre, .filete, .lema { animation: sube .9s .35s cubic-bezier(.2,.8,.2,1) both; }
  .puntos, .estado { animation: sube .9s .5s cubic-bezier(.2,.8,.2,1) both; }
  .destello { animation: destello 3s ease-in-out 1.1s infinite; }
  .puntos div { animation: bota 1.2s ease-in-out infinite; }
  .puntos div:nth-child(2) { animation-delay: .15s; } .puntos div:nth-child(3) { animation-delay: .3s; }
  @keyframes salta { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: none; } }
  @keyframes respira { 0%, 100% { box-shadow: 0 18px 40px rgba(20,41,90,.22), 0 2px 6px rgba(20,41,90,.18); } 50% { box-shadow: 0 24px 52px rgba(20,41,90,.3), 0 2px 6px rgba(20,41,90,.18); } }
  @keyframes sube { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes bota { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-6px); opacity: 1; } }
  @keyframes destello { 0% { background-position: 100% 0; } 55%, 100% { background-position: 0% 0; } }
  @media (prefers-reduced-motion: reduce) { .icono, .nombre, .filete, .lema, .puntos, .estado, .destello, .puntos div { animation: none; } }
</style>
</head>
<body>
<div class="pantalla">
  <div class="icono">
    <div class="a">
      <img src="../../../public/marca/alphapol-isotipo.webp" alt="">
      <div class="destello"></div>
    </div>
  </div>
  <p class="nombre"><span class="oro">ALPHA</span><span>POL</span></p>
  <div class="filete"></div>
  <p class="lema">CENTRO DE FORMACIÓN</p>
  <div class="puntos" role="status" aria-label="Cargando"><div></div><div></div><div></div></div>
  <p class="estado">Preparando tu sesión</p>
</div>
</body>
</html>
