<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Alphapol</title>
<style>
/* ESTILO «OPERATIVO»: sobrio, de academia. Rectas duras, cortes secos, rotulación
   contundente en blanco y oro sobre marino. Nada de brillos ni confeti. */
@font-face{font-family:'BC';font-weight:500;src:url('fuentes/barlow-condensed-latin-500-normal.woff2')}
@font-face{font-family:'BC';font-weight:600;src:url('fuentes/barlow-condensed-latin-600-normal.woff2')}
@font-face{font-family:'BC';font-weight:700;src:url('fuentes/barlow-condensed-latin-700-normal.woff2')}
@font-face{font-family:'BC';font-weight:800;src:url('fuentes/barlow-condensed-latin-800-normal.woff2')}
@font-face{font-family:'BW';font-weight:500;src:url('fuentes/barlow-latin-500-normal.woff2')}
@font-face{font-family:'BW';font-weight:600;src:url('fuentes/barlow-latin-600-normal.woff2')}
:root{--marino:#14295a;--noche:#07122b;--oro:#c5a738;--oro2:#e2c977;--oro3:#f6e7ae;--rojo:#ff5a45;--oroGrad:linear-gradient(100deg,#9c7a22 0%,#c5a738 35%,#ecd78a 55%,#c5a738 75%,#9c7a22 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07122b;font-family:'BC',sans-serif;color:#fff}
#stage{position:absolute;inset:0;width:1080px;height:1920px;transform-origin:50% 45%;
  background:linear-gradient(180deg,#0f2250 0%,#0b1b42 45%,#07122b 100%)}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.abs{position:absolute}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(95% 65% at 50% 45%,transparent 55%,rgba(2,6,18,.7) 100%)}
.oro{background:var(--oroGrad);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}

#prog{left:90px;top:206px;width:900px;height:4px;background:rgba(255,255,255,.14)}
#prog i{display:block;height:100%;width:0;background:var(--oro)}

#head{left:90px;width:900px;top:232px;height:70px;display:flex;align-items:center;gap:18px}
#head img{height:54px}
#head .nm{display:flex;font-weight:800;font-size:50px;letter-spacing:.14em;line-height:1}
#head .t{color:#fff}
#tag{margin-left:auto;font-weight:700;font-size:38px;letter-spacing:.2em;color:var(--noche);background:var(--oro);padding:6px 20px 4px;line-height:1.1}
#tema{left:90px;width:900px;top:312px;font-weight:600;font-size:32px;letter-spacing:.2em;color:#aebbe0;text-transform:uppercase}

#hook{left:90px;width:900px;top:640px;height:600px}
#hookTxt{font-weight:800;font-size:236px;line-height:.86;text-transform:uppercase;color:#fff;letter-spacing:-.005em}
#hookTxt div{overflow:hidden;white-space:nowrap}
#hookTxt span{display:inline-block}
#hookBar{height:12px;background:var(--oro);width:0;margin-top:34px}
#nivel{display:flex;align-items:center;gap:14px;margin-top:30px;font-weight:700;font-size:44px;letter-spacing:.28em;color:#cdd7f2}
#nivel i{display:block;width:62px;height:16px;background:rgba(255,255,255,.2)}
#nivel i.on{background:var(--oro)}

#qwrap{left:90px;width:900px;top:395px;height:390px;display:flex;flex-direction:column;justify-content:center}
#qlabel{font-weight:700;font-size:32px;letter-spacing:.36em;color:var(--oro);margin-bottom:20px;display:flex;align-items:center;gap:20px}
#qlabel b{display:block;height:3px;background:var(--oro);width:0}
#qbox{border-left:10px solid var(--oro);padding-left:34px}
#qtext{font-weight:700;line-height:1.04}
#qtext .w{display:inline-block;margin-right:.24em;will-change:transform,opacity}

.card{position:absolute;left:90px;width:900px;height:140px;display:flex;align-items:stretch;
  background:linear-gradient(90deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.16);will-change:transform,opacity}
.card .l{flex:none;width:112px;display:flex;align-items:center;justify-content:center;background:rgba(7,18,43,.6);border-right:2px solid var(--oro);
  font-weight:800;font-size:76px;color:var(--oro)}
.card .x{flex:1;display:flex;align-items:center;padding:0 30px;font-weight:600;font-size:54px;line-height:1.02}
.card .ok{flex:none;width:84px;display:flex;align-items:center;justify-content:center;opacity:0}
.card .ok svg{width:58px;height:58px}
.card.win{background:linear-gradient(90deg,#d9bd55,#e9d386);border-color:#f6e7ae}
.card.win .l{background:#07122b;color:var(--oro2);border-right-color:#07122b}
.card.win .x{color:#07122b;font-weight:700}

#timer{left:90px;width:900px;top:1370px;height:170px}
#tlab{font-weight:700;font-size:32px;letter-spacing:.36em;color:#aebbe0}
#tnum{position:absolute;right:0;top:-18px;font-weight:800;font-size:128px;line-height:1;font-variant-numeric:tabular-nums}
#tbar{position:absolute;left:0;top:98px;width:900px;height:16px;background:rgba(255,255,255,.14)}
#tbar i{display:block;height:100%;width:100%;background:var(--oro);transform-origin:0 50%}
#tticks{position:absolute;left:0;top:122px;width:900px;height:24px}
#tticks b{position:absolute;top:0;width:2px;height:16px;background:rgba(255,255,255,.35)}

#rc{left:90px;width:900px;top:405px;font-weight:700;font-size:32px;letter-spacing:.36em;color:var(--oro);opacity:0}
#xw{left:90px;top:700px;width:900px;border-left:10px solid var(--oro);padding-left:34px}
#xl{font-weight:700;font-size:32px;letter-spacing:.36em;color:var(--oro);margin-bottom:18px}
#xt{font-weight:500;font-family:'BW',sans-serif;line-height:1.26;color:#eef2ff}
#xt .w{display:inline-block;margin-right:.26em;will-change:transform,opacity}
#ref{left:90px;top:1330px;display:flex}
#ref div{display:flex;align-items:center;gap:18px;padding:14px 34px 14px 24px;border:3px solid var(--oro);background:rgba(197,167,56,.14);
  font-weight:700;font-size:56px;letter-spacing:.08em;color:var(--oro3)}
#ref svg{width:48px;height:48px}

#end{left:0;top:0;width:1080px;height:1920px;opacity:0;background:linear-gradient(180deg,#0f2250,#07122b)}
#endIso{position:absolute;left:380px;top:400px;width:320px}
#endLogo{position:absolute;left:190px;top:830px;width:700px}
#endRule{position:absolute;left:190px;top:1090px;width:0;height:6px;background:var(--oro)}
#endTxt{position:absolute;left:110px;width:860px;top:1130px;text-align:center;font-weight:700;font-size:62px;line-height:1.08;color:#fff;text-transform:uppercase}
#endTxt em{font-style:normal;color:var(--oro)}
#endSub{position:absolute;left:0;width:1080px;top:1330px;text-align:center;font-weight:600;font-size:34px;letter-spacing:.16em;color:#aebbe0}
#endBtn{position:absolute;left:0;width:1080px;top:1420px;display:flex;justify-content:center}
#endBtn div{padding:12px 56px 14px;background:var(--oro);color:#07122b;font-weight:800;font-size:72px;letter-spacing:.06em}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <svg id="frame" class="abs" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" stroke="#c5a738" stroke-width="4">
    <path d="M60 262V232H90"/><path d="M990 232h30v30"/><path d="M60 1570v30h30"/><path d="M1020 1570v30h-30"/>
  </svg>
  <div id="prog" class="abs"><i></i></div>

  <div id="head" class="abs"><img id="hIso"><span class="nm"><span class="oro" id="hN">ALPHA</span><span class="t">POL</span></span><span id="tag"></span></div>
  <div id="tema" class="abs"></div>

  <div id="hook" class="abs">
    <div id="hookTxt"><div><span id="h1">¿LA</span></div><div><span id="h2">SABES?</span></div></div>
    <div id="hookBar"></div>
    <div id="nivel"></div>
  </div>

  <div id="qwrap" class="abs"><div id="qlabel"><span>PREGUNTA</span><b id="qb1"></b></div><div id="qbox"><div id="qtext"></div></div></div>
  <div id="cards"></div>

  <div id="timer" class="abs">
    <div id="tlab">TIEMPO</div><div id="tnum"></div>
    <div id="tbar"><i id="tfill"></i></div><div id="tticks"></div>
  </div>

  <div id="rc" class="abs">RESPUESTA CORRECTA</div>
  <div id="xw" class="abs"><div id="xl">FUNDAMENTO</div><div id="xt"></div></div>
  <div id="ref" class="abs"><div><svg viewBox="0 0 24 24" fill="none" stroke="#e2c977" stroke-width="2" stroke-linecap="square"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span id="refT"></span></div></div>

  <canvas id="fx" width="1080" height="1920"></canvas>
  <div class="vig"></div>
  <div id="end" class="abs">
    <img id="endIso"><img id="endLogo"><div id="endRule"></div>
    <div id="endTxt">Prepara tu oposición <em>con método</em></div>
    <div id="endSub">GRUPOS REDUCIDOS · SEGUIMIENTO INDIVIDUAL</div>
    <div id="endBtn"><div>alphapol.es</div></div>
  </div>
  <div id="flash"></div>
</div>

<script>
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outQuint = (k) => 1 - Math.pow(1 - k, 5);
const inOutCubic = (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const $ = (id) => document.getElementById(id);
const LET = ['A', 'B', 'C'];
const CT = (i) => 810 + i * 160;   // arriba de cada opción
const HERO = 470;                   // donde sube la correcta

let D, L, cardEls = [], qWords = [], xWords = [];
const bgc = $('bg').getContext('2d'), fxc = $('fx').getContext('2d');

function setup(data, linea, assets) {
  D = data; L = linea;
  $('hIso').src = assets.isotipo; $('endIso').src = assets.isotipo; $('endLogo').src = assets.logotipo;
  $('tag').textContent = `TEMA ${String(D.tema).padStart(2, '0')}`;
  $('tema').textContent = D.temaTitulo;
  $('refT').textContent = D.referencia ? D.referencia.toUpperCase() : '';
  if (!D.referencia) $('ref').style.display = 'none';

  const nv = $('nivel'); nv.innerHTML = '<span style="margin-right:14px">NIVEL</span>';
  for (let i = 1; i <= 3; i++) { const b = document.createElement('i'); if (i <= D.dificultad) b.className = 'on'; nv.appendChild(b); }

  const n = D.pregunta.length;
  $('qtext').style.fontSize = (n <= 60 ? 84 : n <= 95 ? 72 : 62) + 'px';
  const qt = $('qtext'); qt.innerHTML = '';
  D.pregunta.split(/\s+/).forEach((w) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w; qt.appendChild(s); qWords.push(s); });

  const cw = $('cards'); cw.innerHTML = '';
  D.opciones.forEach((o, i) => {
    const c = document.createElement('div'); c.className = 'card'; c.style.top = CT(i) + 'px';
    c.innerHTML = `<div class="l">${LET[i]}</div><div class="x"></div><div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#07122b" stroke-width="3.4" stroke-linecap="square"><path d="M4.5 12.5l5 5L19.5 7"/></svg></div>`;
    c.querySelector('.x').textContent = o;
    cw.appendChild(c); cardEls.push(c);
  });

  const xt = $('xt'); xt.innerHTML = '';
  D.explicacion.split(/\s+/).forEach((w) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w; xt.appendChild(s); xWords.push(s); });
  $('xt').style.fontSize = (D.explicacion.length <= 85 ? 64 : D.explicacion.length <= 130 ? 56 : 50) + 'px';

  const tk = $('tticks'); tk.innerHTML = '';
  for (let s = 0; s <= L.cdDur; s++) { const b = document.createElement('b'); b.style.left = (900 * (1 - s / L.cdDur) - 1 + 90 * 0) + 'px'; tk.appendChild(b); }
}

// fondo: rejilla fina que avanza despacio y una franja de luz diagonal muy tenue
function drawBg(t) {
  bgc.clearRect(0, 0, W, H);
  bgc.strokeStyle = 'rgba(160,185,255,.045)'; bgc.lineWidth = 2;
  const off = (t * 14) % 90;
  for (let x = -90 + off; x < W + 90; x += 90) { bgc.beginPath(); bgc.moveTo(x, 0); bgc.lineTo(x, H); bgc.stroke(); }
  for (let y = -90 + off; y < H + 90; y += 90) { bgc.beginPath(); bgc.moveTo(0, y); bgc.lineTo(W, y); bgc.stroke(); }
  const x0 = ((t * 60) % (W + 900)) - 700;
  const g = bgc.createLinearGradient(x0, 0, x0 + 500, 500);
  g.addColorStop(0, 'rgba(226,201,119,0)'); g.addColorStop(.5, 'rgba(226,201,119,.05)'); g.addColorStop(1, 'rgba(226,201,119,0)');
  bgc.fillStyle = g; bgc.fillRect(0, 0, W, H);
}

function fChrome(t) {
  const a = 1 - seg(t, L.end0 - .15, L.end0 + .2);
  const inK = outQuint(seg(t, 0, .35));
  ['head', 'prog', 'frame'].forEach((id) => { $(id).style.opacity = a * inK; });
  $('head').style.transform = `translateX(${lerp(-60, 0, inK)}px)`;
  $('tema').style.opacity = a * outQuint(seg(t, .2, .5));
  $('prog').firstElementChild.style.width = (900 * clamp(t / L.end0)) + 'px';
  $('hN').style.backgroundPosition = `${lerp(0, 160, (t * .2) % 1)}% 0`;
}
function fHook(t) {
  const e = $('hook'); e.style.display = (t >= L.q0) ? 'none' : 'block';
  const k1 = outQuint(seg(t, .12, .5)), k2 = outQuint(seg(t, .26, .64));
  $('h1').style.transform = `translateY(${lerp(100, 0, k1)}%)`; $('h2').style.transform = `translateY(${lerp(100, 0, k2)}%)`;
  $('hookBar').style.width = (900 * outQuint(seg(t, .5, .95))) + 'px';
  const kn = outQuint(seg(t, .75, 1.1)); $('nivel').style.opacity = kn; $('nivel').style.transform = `translateX(${lerp(-40, 0, kn)}px)`;
  e.style.opacity = 1 - seg(t, L.q0 - .12, L.q0);
}
function fQuestion(t) {
  const q0 = L.q0;
  const outK = seg(t, L.trans - .05, L.trans + .15);
  const wrap = $('qwrap'); wrap.style.opacity = 1 - outK;
  wrap.style.display = (outK >= 1 || t < q0 - .05) ? 'none' : 'flex';
  const lk = outQuint(seg(t, q0, q0 + .35));
  $('qlabel').style.opacity = lk; $('qb1').style.width = (lk * 150) + 'px';
  $('qbox').style.borderLeftColor = `rgba(197,167,56,${lk})`;
  const per = (L.qDur - .5) / Math.max(1, qWords.length);
  qWords.forEach((s, i) => {
    const a0 = q0 + .2 + i * per, k = outQuint(seg(t, a0, a0 + .22));
    s.style.opacity = k; s.style.transform = `translateX(${lerp(26, 0, k)}px)`;
  });
}
function fCards(t) {
  const win = D.correcta;
  const rv = seg(t, L.reveal, L.reveal + .25);
  const tr = inOutCubic(seg(t, L.trans, L.trans + .6));
  cardEls.forEach((c, i) => {
    const a0 = L.cards0 + i * .12, k = outQuint(seg(t, a0, a0 + .4));
    const x = lerp(-1000, 0, k); let y = 0, sc = 1, op = clamp(k * 3);
    const isWin = i === win;
    if (t >= L.reveal) {
      if (isWin) { y = lerp(0, HERO - CT(win), tr); sc = lerp(1, 1.04, tr); }
      else { op = lerp(1, .18, rv) * (1 - seg(t, L.trans, L.trans + .3)); y = lerp(0, 60, seg(t, L.trans, L.trans + .4)); }
    }
    if (t > L.end0 - .15) op = Math.min(op, 1 - seg(t, L.end0 - .15, L.end0 + .1));
    c.style.opacity = op;
    c.style.transform = `translate(${x}px,${y}px) scale(${sc})`;
    c.style.filter = (t >= L.reveal && !isWin) ? `grayscale(${rv})` : 'none';
    if (t >= L.reveal && isWin) { c.classList.add('win'); c.querySelector('.ok').style.opacity = 1; }
    else { c.classList.remove('win'); c.querySelector('.ok').style.opacity = 0; }
  });
}
function fTimer(t) {
  const e = $('timer');
  const inK = outQuint(seg(t, L.cards0 + .5, L.cdStart + .1)), out = seg(t, L.reveal - .02, L.reveal + .12);
  e.style.opacity = inK * (1 - out); e.style.transform = `translateY(${lerp(30, 0, inK)}px)`;
  const left = clamp(1 - (t - L.cdStart) / L.cdDur), active = t >= L.cdStart;
  const urg = active && left < .34;
  $('tfill').style.transform = `scaleX(${active ? left : 1})`;
  $('tfill').style.background = urg ? '#ff5a45' : '#c5a738';
  const s = active ? Math.max(0, Math.ceil(L.cdDur - (t - L.cdStart))) : L.cdDur;
  $('tnum').textContent = `00:${String(s).padStart(2, '0')}`;
  $('tnum').style.color = urg ? '#ff7a68' : '#fff';
  $('tnum').style.transformOrigin = '100% 50%';
  $('tnum').style.transform = active ? `scale(${1 + .07 * Math.max(0, 1 - ((t - L.cdStart) % 1) * 6)})` : '';
}
function fExplain(t) {
  const fade = 1 - seg(t, L.end0 - .15, L.end0 + .1);
  const rck = outQuint(seg(t, L.trans + .15, L.trans + .45));
  $('rc').style.opacity = rck * fade; $('rc').style.transform = `translateX(${lerp(-40, 0, rck)}px)`;
  const lk = outQuint(seg(t, L.expl0, L.expl0 + .3));
  $('xw').style.opacity = lk * fade; $('xw').style.borderLeftColor = `rgba(197,167,56,${lk})`;
  $('xl').style.transform = `translateX(${lerp(-40, 0, lk)}px)`;
  const per = L.explDur / Math.max(1, xWords.length) * .9;
  xWords.forEach((s, i) => {
    const a0 = L.expl0 + .2 + i * per, k = outQuint(seg(t, a0, a0 + .2));
    s.style.opacity = k; s.style.transform = `translateX(${lerp(22, 0, k)}px)`;
  });
  const rk = outQuint(seg(t, L.ref0, L.ref0 + .3));
  $('ref').style.opacity = rk * fade; $('ref').style.transform = `translateX(${lerp(-70, 0, rk)}px)`;
}
function fEnd(t) {
  const e = $('end'), k0 = seg(t, L.end0, L.end0 + .12);
  e.style.opacity = k0; e.style.display = k0 <= 0 ? 'none' : 'block';
  const k1 = outQuint(seg(t, L.end0 + .05, L.end0 + .5));
  $('endIso').style.opacity = k1; $('endIso').style.transform = `translateY(${lerp(40, 0, k1)}px)`;
  const k2 = outQuint(seg(t, L.end0 + .25, L.end0 + .7));
  $('endLogo').style.opacity = k2; $('endLogo').style.transform = `translateY(${lerp(30, 0, k2)}px)`;
  $('endRule').style.width = (700 * outQuint(seg(t, L.end0 + .45, L.end0 + .9))) + 'px';
  const k3 = outQuint(seg(t, L.end0 + .6, L.end0 + 1.0));
  $('endTxt').style.opacity = k3; $('endTxt').style.transform = `translateY(${lerp(30, 0, k3)}px)`;
  $('endSub').style.opacity = outQuint(seg(t, L.end0 + .85, L.end0 + 1.2));
  const k4 = outQuint(seg(t, L.end0 + 1.05, L.end0 + 1.4));
  $('endBtn').style.opacity = k4; $('endBtn').style.transform = `translateY(${lerp(30, 0, k4)}px)`;
}
// el único efecto: una barrida seca de luz sobre la correcta al desvelar
function fFx(t) {
  fxc.clearRect(0, 0, W, H);
  const dt = t - L.reveal;
  if (dt < 0 || dt > .6) return;
  const y = CT(D.correcta), k = outQuint(clamp(dt / .45));
  const x = lerp(-300, 1200, k);
  const g = fxc.createLinearGradient(x - 160, 0, x + 160, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, `rgba(255,255,255,${.75 * (1 - dt / .6)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  fxc.save(); fxc.beginPath(); fxc.rect(90, y, 900, 140); fxc.clip(); fxc.fillStyle = g; fxc.fillRect(x - 160, y, 320, 140); fxc.restore();
}
function fCamera(t) {
  const dolly = 1 + .03 * (t / L.total);
  const dt = t - L.reveal;
  let sy = 0;
  if (dt >= 0 && dt < .35) sy = 9 * Math.pow(1 - dt / .35, 2);   // un golpe seco, sin temblor
  $('stage').style.transform = `translateY(${sy}px) scale(${dolly})`;
  $('flash').style.opacity = dt >= 0 && dt < .12 ? .16 * (1 - dt / .12) : 0;
}
function render(t) { drawBg(t); fCamera(t); fChrome(t); fHook(t); fQuestion(t); fCards(t); fTimer(t); fExplain(t); fFx(t); fEnd(t); }
window.setup = setup; window.render = render;
</script>
</body>
</html>
