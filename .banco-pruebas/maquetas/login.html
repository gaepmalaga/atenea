<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquetas de login</title>
<link rel="stylesheet" href="../estilos.css">
</head><body><div id="raiz"></div>
<script>
const P = new URLSearchParams(location.search);
const V = P.get('v') || 'a';

/* Los emblemas. Cada uno decide su propio contenedor: no todos quieren ir
   dentro del cuadrado redondeado, que es justo la parte que cansa. */
const MARCAS = {

  // A · MONOGRAMA. La inicial, construida como una letra y no como un icono
  //     metido en una caja. Es lo que hacen las marcas que no quieren depender
  //     de un dibujo.
  a: {
    nombre: 'Monograma',
    html: `<div class="relative w-20 h-20 sm:w-24 sm:h-24 mx-auto">
      <div class="absolute inset-0 bg-indigo-500/40 blur-xl rounded-2xl sm:rounded-3xl"></div>
      <div class="relative w-full h-full flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-700 text-white border border-white/20 shadow-lg shadow-indigo-900/30 rounded-2xl sm:rounded-3xl">
        <svg viewBox="0 0 64 64" width="42" height="42" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 52 L32 13 L52 52"/><path d="M21 39 H43"/>
        </svg>
      </div></div>`
  },

  // B · ESCUDO. El lenguaje institucional. Un opositor a CNP reconoce la forma
  //     antes de leer el nombre.
  b: {
    nombre: 'Escudo',
    html: `<div class="relative w-20 h-20 sm:w-24 sm:h-24 mx-auto flex items-center justify-center">
      <div class="absolute inset-2 bg-indigo-500/40 blur-xl rounded-full"></div>
      <svg class="relative" viewBox="0 0 64 64" width="80" height="80" fill="none">
        <defs><linearGradient id="ge" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4338ca"/>
        </linearGradient></defs>
        <path d="M32 4 L56 13 V32 C56 45 45 55 32 60 C19 55 8 45 8 32 V13 Z"
              fill="url(#ge)" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
        <path d="M22 43 L32 19 L42 43" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M26.5 34.5 H37.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      </svg></div>`
  },

  // C · EL BUHO. Atenea. Es literalmente de donde viene el nombre de la
  //     plataforma, y hoy no aparece por ningun lado.
  c: {
    nombre: 'Búho de Atenea',
    html: `<div class="relative w-20 h-20 sm:w-24 sm:h-24 mx-auto">
      <div class="absolute inset-0 bg-indigo-500/40 blur-xl rounded-2xl sm:rounded-3xl"></div>
      <div class="relative w-full h-full flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-700 text-white border border-white/20 shadow-lg shadow-indigo-900/30 rounded-2xl sm:rounded-3xl">
        <svg viewBox="0 0 64 64" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 22 L15 9"/><path d="M44 22 L49 9"/>
          <path d="M32 18 C20 18 14 26 14 35 C14 46 22 55 32 55 C42 55 50 46 50 35 C50 26 44 18 32 18 Z"/>
          <circle cx="24" cy="33" r="6.6"/><circle cx="40" cy="33" r="6.6"/>
          <path d="M32 38 L28.5 44 H35.5 Z" fill="currentColor" stroke="none"/>
        </svg>
      </div></div>`
  },

  // D · CASCO. Atenea otra vez, pero en su version de estrategia y no de
  //     sabiduria. Mas duro, mas de oposicion.
  d: {
    nombre: 'Frontispicio',
    html: `<div class="relative w-20 h-20 sm:w-24 sm:h-24 mx-auto">
      <div class="absolute inset-0 bg-indigo-500/40 blur-xl rounded-2xl sm:rounded-3xl"></div>
      <div class="relative w-full h-full flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-700 text-white border border-white/20 shadow-lg shadow-indigo-900/30 rounded-2xl sm:rounded-3xl">
        <svg viewBox="0 0 64 64" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 9 L53 22 H11 Z"/>
          <path d="M18 29 V46"/><path d="M27 29 V46"/><path d="M37 29 V46"/><path d="M46 29 V46"/>
          <path d="M12 53 H52"/>
        </svg>
      </div></div>`
  },

  // E · ESTRELLA DE SIETE PUNTAS. La forma de placa. Institucional sin copiar
  //     ningun emblema real.
  e: {
    nombre: 'Placa',
    html: `<div class="relative w-20 h-20 sm:w-24 sm:h-24 mx-auto flex items-center justify-center">
      <div class="absolute inset-2 bg-indigo-500/40 blur-xl rounded-full"></div>
      <svg class="relative" viewBox="0 0 64 64" width="84" height="84" fill="none">
        <defs><linearGradient id="gp" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4338ca"/>
        </linearGradient></defs>
        <path id="estrella" fill="url(#gp)" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
        <path d="M23 42 L32 20 L41 42" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M27 34 H37" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/>
      </svg></div>`,
    despues() {
      const N = 7, cx = 32, cy = 32, R = 29, r = 20, p = [];
      for (let i = 0; i < N * 2; i++) {
        const rad = i % 2 ? r : R;
        const ang = (Math.PI / N) * i - Math.PI / 2;
        p.push(`${(cx + rad * Math.cos(ang)).toFixed(2)} ${(cy + rad * Math.sin(ang)).toFixed(2)}`);
      }
      document.getElementById('estrella').setAttribute('d', 'M' + p.join(' L') + ' Z');
    }
  },

  // F · SIN EMBLEMA. Solo tipografia. La opcion honesta cuando ningun dibujo
  //     aporta: se apuesta por el nombre, que es lo unico que el usuario
  //     necesita reconocer.
  f: {
    nombre: 'Sólo tipografía',
    html: `<div class="flex items-center justify-center gap-3 mb-1">
      <span class="h-px w-10 bg-gradient-to-r from-transparent to-indigo-500"></span>
      <span class="text-[10px] font-black uppercase tracking-[0.35em] text-indigo-500 dark:text-indigo-400">CNP</span>
      <span class="h-px w-10 bg-gradient-to-l from-transparent to-indigo-500"></span>
    </div>`
  },
};

const m = MARCAS[V];

document.getElementById('raiz').innerHTML = `
<main class="min-h-dvh flex flex-col items-center justify-center p-4 sm:p-6">
  <div class="w-full max-w-md space-y-6 sm:space-y-8">
    <header class="text-center space-y-4">
      ${m.html}
      <div class="space-y-1">
        <h1 class="text-3xl sm:text-4xl font-black tracking-tighter text-slate-900 dark:text-white">Atenea Policial</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed font-semibold">Preparación para Policía Nacional</p>
      </div>
    </header>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl sm:rounded-3xl min-w-0 p-4 sm:p-6 shadow-lg shadow-slate-900/5 dark:shadow-black/30 space-y-6">
      <div class="grid grid-cols-2 gap-1 p-1 rounded-xl sm:rounded-2xl bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
        <button class="inline-flex items-center justify-center gap-2 font-black uppercase tracking-wider rounded-xl sm:rounded-2xl min-h-[44px] bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 px-3 py-2 text-[11px]">Entrar</button>
        <button class="inline-flex items-center justify-center gap-2 font-black uppercase tracking-wider rounded-xl sm:rounded-2xl min-h-[44px] text-slate-500 dark:text-slate-400 px-3 py-2 text-[11px]">Crear cuenta</button>
      </div>

      <form class="space-y-4">
        <div>
          <label class="text-[10px] sm:text-xs font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 block mb-2">Correo electrónico</label>
          <input class="w-full bg-white dark:bg-slate-950 border-2 border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 outline-none rounded-xl sm:rounded-2xl min-h-[44px] px-4 py-3 text-base sm:text-sm" placeholder="tu@correo.com">
        </div>
        <div>
          <label class="text-[10px] sm:text-xs font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 block mb-2">Contraseña</label>
          <div class="relative">
            <input type="password" value="12345678" class="w-full bg-white dark:bg-slate-950 border-2 border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white outline-none rounded-xl sm:rounded-2xl min-h-[44px] px-4 py-3 pr-12 text-base sm:text-sm">
            <div class="absolute inset-y-0 right-0 flex items-center pr-1.5">
              <button class="flex items-center justify-center px-3 min-h-[44px] rounded-lg text-slate-500 dark:text-slate-400">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
              </button>
            </div>
          </div>
        </div>
        <button class="w-full inline-flex items-center justify-center gap-2 font-black uppercase tracking-wider rounded-xl sm:rounded-2xl min-h-[44px] bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 px-6 py-4 text-sm mt-2">
          Entrar
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>
    </div>
  </div>
</main>`;

if (m.despues) m.despues();
</script>
</body></html>
