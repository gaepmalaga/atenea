<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>2 · HUD</title>
<link rel="stylesheet" href="base.css"><style>
/* HUD. globals.css ya llama al modo oscuro "CARBON & HUD · Centro de Mando" y
   la plataforma habla de "operacion" y "objetivo". Esto es esa idea llevada
   hasta el final en vez de a medias. Campos como lineas, no como cajas. */
body{background:#050810;color:#dbe4f0;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
.pantalla{padding:0}
.barra{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;
  border-bottom:1px solid #16233a;font-size:9.5px;letter-spacing:.16em;color:#4d6484}
.on{color:#22d3ee;display:flex;align-items:center;gap:6px}
.on::before{content:"";width:6px;height:6px;background:#22d3ee;border-radius:50%;
  box-shadow:0 0 8px #22d3ee}
.cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
.marco{position:relative;padding:34px 22px}
.marco::before,.marco::after{content:"";position:absolute;width:22px;height:22px;border:1.5px solid #22d3ee}
.marco::before{top:0;left:0;border-right:0;border-bottom:0}
.marco::after{bottom:0;right:0;border-left:0;border-top:0}
.id{font-size:9.5px;letter-spacing:.3em;color:#22d3ee;margin-bottom:14px}
h1{font-size:34px;letter-spacing:-.02em;font-weight:700;line-height:1.05;color:#fff;margin-bottom:8px}
.sub{font-size:10.5px;letter-spacing:.16em;color:#4d6484;margin-bottom:38px}
label{display:block;font-size:9.5px;letter-spacing:.2em;color:#4d6484;margin-bottom:9px}
.campo{border-bottom:1px solid #1e3050;padding-bottom:10px;margin-bottom:26px;
  display:flex;align-items:center;gap:10px;transition:border-color .2s}
.campo:focus-within{border-color:#22d3ee}
.campo input{font-size:16px;color:#fff;letter-spacing:.04em;min-height:26px}
.campo input::placeholder{color:#2d4straight}
.campo input::placeholder{color:#33455f}
.ojo{color:#4d6484;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin:-9px -8px -9px 0}
.enviar{width:100%;min-height:52px;margin-top:14px;background:#22d3ee;color:#041018;
  font-weight:700;font-size:11.5px;letter-spacing:.22em;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.alt{margin-top:22px;text-align:center;font-size:10px;letter-spacing:.14em;color:#4d6484}
.alt b{color:#22d3ee;font-weight:400;border-bottom:1px solid #22d3ee;padding-bottom:2px}
.pie{border-top:1px solid #16233a;padding:13px 18px;font-size:9px;letter-spacing:.14em;
  color:#31465f;display:flex;justify-content:space-between}
</style></head><body><div class="pantalla">
  <div class="barra"><span>ATENEA · V2</span><span class="on">EN LÍNEA</span></div>
  <div class="cuerpo"><div class="marco">
    <div class="id">// ACCESO RESTRINGIDO</div>
    <h1>ATENEA<br>POLICIAL</h1>
    <div class="sub">CNP · ESCALA BÁSICA</div>
    <label for="e">IDENTIFICADOR</label>
    <div class="campo"><input id="e" placeholder="tu@correo.com"></div>
    <label for="c">CLAVE</label>
    <div class="campo"><input id="c" type="password" value="12345678">
      <button class="ojo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="enviar">INICIAR SESIÓN</button>
    <div class="alt">SIN CREDENCIALES · <b>SOLICITAR ALTA</b></div>
  </div></div>
  <div class="pie"><span>45 TEMAS</span><span>898 PREGUNTAS</span><span>4.970 FRAGMENTOS</span></div>
</div></body></html>
