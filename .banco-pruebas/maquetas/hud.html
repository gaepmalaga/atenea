<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>HUD</title>
<link rel="stylesheet" href="base.css"><style>
/* LA ESTRUCTURA QUE SE APROBO (era la d2), con tres paletas.
   Lo que se conserva: barra de estado, corchetes de encuadre, campos como
   LINEA y no como caja, boton con la esquina cortada, pie de datos.
   Lo que se tira: el cian sobre negro. Cansa la vista y no es de esta
   plataforma — `globals.css` tiene su azul y su indigo desde el principio.
   Y fuera los contadores: el numero de preguntas cambia cada vez que se
   siembra, asi que ponerlo en la pantalla de entrada es garantizar que
   algun dia mienta. */
body{background:var(--bg);color:var(--tx);
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
.pantalla{padding:0}
.barra{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--li);font-size:9.5px;letter-spacing:.16em;color:var(--mu)}
.on{color:var(--ac);display:flex;align-items:center;gap:6px}
.on::before{content:"";width:6px;height:6px;background:var(--ac);border-radius:50%}
.cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
.marco{position:relative;padding:34px 22px}
.marco::before,.marco::after{content:"";position:absolute;width:22px;height:22px;border:1.5px solid var(--ac)}
.marco::before{top:0;left:0;border-right:0;border-bottom:0}
.marco::after{bottom:0;right:0;border-left:0;border-top:0}
.id{font-size:9.5px;letter-spacing:.3em;color:var(--ac);margin-bottom:14px}
h1{font-size:32px;letter-spacing:-.02em;font-weight:700;line-height:1.06;color:var(--hi);margin-bottom:9px}
.sub{font-size:10.5px;letter-spacing:.16em;color:var(--mu);margin-bottom:38px}
label{display:block;font-size:9.5px;letter-spacing:.2em;color:var(--mu);margin-bottom:9px}
.campo{border-bottom:1px solid var(--li);padding-bottom:10px;margin-bottom:26px;
  display:flex;align-items:center;gap:10px;transition:border-color .2s}
.campo:focus-within{border-color:var(--ac)}
.campo input{font-size:16px;color:var(--hi);letter-spacing:.04em;min-height:26px}
.campo input::placeholder{color:var(--pl)}
.ojo{color:var(--mu);min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin:-9px -8px -9px 0}
.enviar{width:100%;min-height:52px;margin-top:14px;background:var(--bt);color:var(--btx);
  font-weight:700;font-size:11.5px;letter-spacing:.22em;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.alt{margin-top:22px;text-align:center;font-size:10px;letter-spacing:.14em;color:var(--mu)}
.alt b{color:var(--ac);font-weight:400;border-bottom:1px solid var(--ac);padding-bottom:2px}
.pie{border-top:1px solid var(--li);padding:13px 18px;font-size:9px;letter-spacing:.14em;
  color:var(--mu);display:flex;justify-content:space-between}

/* A · EL INDIGO DE LA PLATAFORMA. El mismo `--brand-primary` que ya usa todo
      lo demas, asi que la entrada y el interior son la misma aplicacion. */
body.a{--bg:#0b1020;--li:#1e2745;--ac:#818cf8;--tx:#cbd5e1;--hi:#fff;--mu:#64748b;
  --pl:#3b4763;--bt:#6366f1;--btx:#fff}
/* B · AZUL INSTITUCIONAL. Marino profundo. Menos "videojuego", mas
      administracion publica: es el azul con el que se viste el cuerpo. */
body.b{--bg:#081426;--li:#14304f;--ac:#60a5fa;--tx:#c7d6e8;--hi:#fff;--mu:#5c7characters;
  --pl:#33506f;--bt:#1d4ed8;--btx:#fff}
body.b{--mu:#5c7590}
/* C · GRAFITO. Sin color: solo blanco, negro y grises. El unico acento es el
      propio blanco. Es la version que no puede pasar de moda ni cansar. */
body.c{--bg:#0c0e11;--li:#23262c;--ac:#f8fafc;--tx:#c3c8d0;--hi:#fff;--mu:#6b7280;
  --pl:#3a3f48;--bt:#f8fafc;--btx:#0c0e11}
</style></head><body><div class="pantalla">
  <div class="barra"><span>ATENEA</span><span class="on">EN LÍNEA</span></div>
  <div class="cuerpo"><div class="marco">
    <div class="id">// ACCESO</div>
    <h1>ATENEA<br>POLICIAL</h1>
    <div class="sub">POLICÍA NACIONAL · ESCALA BÁSICA</div>
    <label for="e">CORREO</label>
    <div class="campo"><input id="e" placeholder="tu@correo.com"></div>
    <label for="c">CONTRASEÑA</label>
    <div class="campo"><input id="c" type="password" value="12345678">
      <button class="ojo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="enviar">ENTRAR</button>
    <div class="alt">¿SIN CUENTA? · <b>CREAR UNA</b></div>
  </div></div>
  <div class="pie"><span>TEMARIO OFICIAL</span><span>ESCALA BÁSICA</span></div>
</div>
<script>document.body.className=new URLSearchParams(location.search).get('p')||'a';</script>
</body></html>
