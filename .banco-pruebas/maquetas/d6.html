<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>6 · Vitrina</title>
<link rel="stylesheet" href="base.css"><style>
/* VITRINA. La unica que VENDE algo antes de pedir la contrasena. Las otras
   cinco dan por hecho que quien llega ya sabe lo que es Atenea; esta ensena
   los numeros reales de la plataforma primero. Son datos de verdad, leidos
   de la base de datos hoy: 45 temas, 898 preguntas, 4.970 fragmentos. */
body{background:#070a14;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased}
.pantalla{padding:34px 22px 26px;justify-content:center;gap:22px}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.logo .m{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#f59e0b,#d97706);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#1a1206}
.logo .t{font-size:16px;font-weight:800;letter-spacing:-.02em}
.logo .t span{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;
  color:#7c8699;text-transform:uppercase;margin-top:2px}
h1{font-size:33px;line-height:1.14;letter-spacing:-.03em;font-weight:800}
h1 em{font-style:normal;color:#f59e0b}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cifra{background:#0e1424;border:1px solid #1b2439;border-radius:13px;padding:13px 10px;text-align:center}
.cifra b{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em;color:#f59e0b}
.cifra span{display:block;font-size:9.5px;color:#7c8699;letter-spacing:.07em;
  text-transform:uppercase;margin-top:4px;line-height:1.3}
.tarjeta{background:#0e1424;border:1px solid #1b2439;border-radius:19px;padding:20px 18px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:#7c8699;margin-bottom:8px}
.campo{background:#070a14;border:1.5px solid #1b2439;border-radius:12px;padding:0 14px;
  margin-bottom:15px;display:flex;align-items:center;gap:10px;min-height:52px}
.campo:focus-within{border-color:#f59e0b}
.campo input{font-size:16px;min-height:26px}
.campo input::placeholder{color:#414c62}
.ojo{color:#5c6780;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin-right:-10px}
.enviar{width:100%;min-height:54px;border-radius:12px;
  background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a1206;
  font-size:15px;font-weight:800;letter-spacing:.01em;margin-top:6px}
.alt{margin-top:16px;text-align:center;font-size:13px;color:#7c8699}
.alt b{color:#f59e0b}
.nota{text-align:center;font-size:11px;color:#4d5772;line-height:1.5}
</style></head><body><div class="pantalla">
  <div class="logo"><div class="m">A</div><div class="t">Atenea<span>Policía Nacional</span></div></div>
  <h1>Todo el temario.<br><em>Ya indexado.</em></h1>
  <div class="cifras">
    <div class="cifra"><b>45</b><span>Temas</span></div>
    <div class="cifra"><b>898</b><span>Preguntas</span></div>
    <div class="cifra"><b>4.970</b><span>Fragmentos</span></div>
  </div>
  <div class="tarjeta">
    <label for="e">Correo</label>
    <div class="campo"><input id="e" placeholder="tu@correo.com"></div>
    <label for="c">Contraseña</label>
    <div class="campo"><input id="c" type="password" value="12345678">
      <button class="ojo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="enviar">Entrar</button>
    <div class="alt">¿No tienes cuenta? <b>Regístrate</b></div>
  </div>
  <div class="nota">La nota se calcula como en la convocatoria:<br>cada dos fallos restan un acierto.</div>
</div></body></html>
