<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>4 · Brutalista</title>
<link rel="stylesheet" href="base.css"><style>
/* BRUTALISTA. Cero degradados, cero sombras, cero brillos: bloques planos,
   bordes gruesos y tipografia enorme. Es la unica que no intenta parecer
   cara, y por eso es la que mejor envejece y la que mas se lee de un vistazo
   a la luz del sol. */
body{background:#fff;color:#000;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased}
.pantalla{padding:0}
.cinta{background:#000;color:#fff;padding:11px 20px;font-size:11px;font-weight:800;
  letter-spacing:.16em;display:flex;justify-content:space-between}
.cinta span:last-child{color:#ffe600}
.cuerpo{flex:1;padding:34px 20px;display:flex;flex-direction:column}
h1{font-size:62px;line-height:.86;letter-spacing:-.055em;font-weight:900;text-transform:uppercase}
.marca{background:#ffe600;display:inline-block;padding:0 7px;margin-left:-7px}
.sub{margin:20px 0 34px;font-size:15px;font-weight:600;line-height:1.42;
  border-left:5px solid #000;padding-left:13px}
label{display:block;font-size:11px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:7px}
.campo{border:3px solid #000;padding:0 14px;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;min-height:56px}
.campo:focus-within{background:#ffe600}
.campo input{font-size:17px;font-weight:600;min-height:26px}
.campo input::placeholder{color:#8c8c8c}
.ojo{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin-right:-10px}
.enviar{width:100%;min-height:62px;background:#000;color:#fff;font-size:17px;
  font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin-top:8px;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.alt{margin-top:auto;padding-top:30px;font-size:13px;font-weight:700}
.alt b{background:#ffe600;padding:2px 5px}
</style></head><body><div class="pantalla">
  <div class="cinta"><span>ATENEA POLICIAL</span><span>CNP · ESCALA BÁSICA</span></div>
  <div class="cuerpo">
    <h1>Entra<br>y <span class="marca">saca</span><br>tu plaza</h1>
    <div class="sub">45 temas. 898 preguntas. La nota se calcula como en la convocatoria: cada dos fallos, un acierto menos.</div>
    <label for="e">Correo</label>
    <div class="campo"><input id="e" placeholder="tu@correo.com"></div>
    <label for="c">Contraseña</label>
    <div class="campo"><input id="c" type="password" value="12345678">
      <button class="ojo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="enviar">Entrar <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <div class="alt">¿Sin cuenta? <b>Regístrate aquí</b></div>
  </div>
</div></body></html>
