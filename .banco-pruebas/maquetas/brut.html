<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Brutalista</title>
<link rel="stylesheet" href="base.css"><style>
/* LA OTRA ESTRUCTURA QUE SE APROBO (era la d4), con tres paletas.
   Lo que se conserva: cinta superior, titular enorme con una palabra
   resaltada, subtitulo con filete lateral, campos de borde grueso, boton a
   toda anchura con flecha.
   Lo que se tira: el amarillo. Y "CNP" pasa a "Policia Nacional" en todas
   partes — es el nombre del cuerpo, y las siglas suenan a jerga interna en
   la primera pantalla que ve alguien.
   Fuera tambien el "898 preguntas": ese numero cambia con cada siembra, asi
   que en la pantalla de entrada es una promesa que caduca sola. */
body{background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.pantalla{padding:0}
.cinta{background:var(--tx);color:var(--bg);padding:11px 20px;font-size:11px;font-weight:800;
  letter-spacing:.16em;display:flex;justify-content:space-between}
.cinta span:last-child{color:var(--ac)}
/* El filete de la bandera, en proporciones reales (1:2:1). En el brutalista
   es mas grueso que en el HUD —6px— porque aqui TODO es grueso: un filete
   fino al lado de un titular de 58px y bordes de 3px se veria como un error
   de impresion, no como una decision. */
.bandera{height:6px;background:linear-gradient(to right,
  var(--rojo) 0 22%, var(--oro) 22% 78%, var(--rojo) 78% 100%)}
.cuerpo{flex:1;padding:34px 20px;display:flex;flex-direction:column}
h1{font-size:58px;line-height:.88;letter-spacing:-.055em;font-weight:900;text-transform:uppercase}
.marca{background:var(--ac);color:var(--acx);display:inline-block;padding:0 7px;margin-left:-7px}
.sub{margin:20px 0 34px;font-size:15px;font-weight:600;line-height:1.42;
  border-left:5px solid var(--ac);padding-left:13px;color:var(--tx2)}
label{display:block;font-size:11px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:7px;color:var(--tx2)}
.campo{border:3px solid var(--tx);padding:0 14px;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;min-height:56px}
.campo:focus-within{border-color:var(--ac)}
.campo input{font-size:17px;font-weight:600;min-height:26px}
.campo input::placeholder{color:var(--pl)}
.ojo{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin-right:-10px;color:var(--tx2)}
.enviar{width:100%;min-height:62px;background:var(--bt);color:var(--btx);font-size:17px;
  font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin-top:8px;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.alt{margin-top:auto;padding-top:30px;font-size:13px;font-weight:700;color:var(--tx2)}
.alt b{background:var(--ac);color:var(--acx);padding:2px 5px}

body{--rojo:#c60b1e;--oro:#ffc400}

/* A · BANDERA SOBRE NEGRO. El rojo de la bandera donde estaba el amarillo.
      El contraste maximo del brutalismo, en los colores del pais. */
body.a{--bg:#0b0d10;--tx:#fff;--tx2:#aab2be;--ac:#c60b1e;--acx:#fff;--pl:#4a515e;--bt:#fff;--btx:#0b0d10}

/* B · ORO SOBRE NEGRO. El otro color de la bandera, y el que menos choca
      con los rojos y verdes que el resto de la aplicacion ya usa para
      aciertos y fallos. El resaltado en oro se lee mejor que el rojo sobre
      negro, que a este tamaño vibra. */
body.b{--bg:#0b0d10;--tx:#fff;--tx2:#aab2be;--ac:#ffc400;--acx:#0b0d10;--pl:#4a515e;--bt:#ffc400;--btx:#0b0d10}

/* C · ROJO SOBRE HUESO. La version en claro: papel, tinta marino y el rojo
      de la bandera. Es la que menos cansa de las tres y la unica que se
      puede imprimir. */
body.c{--bg:#f7f4ee;--tx:#111820;--tx2:#3d4a5a;--ac:#c60b1e;--acx:#fff;--pl:#8d99a8;--bt:#111820;--btx:#f7f4ee}
</style></head><body><div class="pantalla">
  <div class="cinta"><span>ATENEA POLICIAL</span><span>POLICÍA NACIONAL</span></div>
  <div class="bandera"></div>
  <div class="cuerpo">
    <h1>Entra<br>y <span class="marca">saca</span><br>tu plaza</h1>
    <div class="sub">El temario oficial completo, con tests que puntúan como la convocatoria: cada dos fallos, un acierto menos.</div>
    <label for="e">Correo</label>
    <div class="campo"><input id="e" placeholder="tu@correo.com"></div>
    <label for="c">Contraseña</label>
    <div class="campo"><input id="c" type="password" value="12345678">
      <button class="ojo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="enviar">Entrar <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <div class="alt">¿Sin cuenta? <b>Regístrate aquí</b></div>
  </div>
</div>
<script>document.body.className=new URLSearchParams(location.search).get('p')||'a';</script>
</body></html>
