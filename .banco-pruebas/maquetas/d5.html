<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>5 · Aire</title>
<link rel="stylesheet" href="base.css"><style>
/* AIRE. Quitar hasta que no quede nada que quitar: sin tarjeta, sin iconos
   de adorno, sin degradados, sin bordes. Solo el nombre, dos lineas y un
   boton. Es la apuesta opuesta a la brutalista y la que mejor aguanta el
   paso del tiempo, porque no tiene nada que pase de moda. */
body{background:#0b0d12;color:#e9ecf2;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased}
.pantalla{padding:0 34px;justify-content:center}
.emblema{width:34px;height:34px;border:1.5px solid #3a4152;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;
  letter-spacing:.02em;color:#aeb6c6;margin-bottom:56px}
h1{font-size:29px;font-weight:300;letter-spacing:-.02em;line-height:1.3;margin-bottom:9px}
h1 b{font-weight:600}
.sub{font-size:14px;color:#6a7386;line-height:1.6;margin-bottom:64px}
label{display:block;font-size:12px;color:#6a7386;margin-bottom:10px}
.campo{border-bottom:1px solid #232838;padding-bottom:13px;margin-bottom:34px;
  display:flex;align-items:center;gap:10px;transition:border-color .25s}
.campo:focus-within{border-color:#e9ecf2}
.campo input{font-size:17px;font-weight:300;min-height:26px}
.campo input::placeholder{color:#3f4759}
.ojo{color:#4b5468;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin:-9px -9px -9px 0}
.enviar{width:100%;min-height:54px;border-radius:6px;background:#e9ecf2;color:#0b0d12;
  font-size:15px;font-weight:600;letter-spacing:-.01em;margin-top:16px}
.alt{margin-top:26px;text-align:center;font-size:13px;color:#5a6377}
.alt b{color:#e9ecf2;font-weight:500}
.pie{position:absolute;bottom:30px;left:34px;right:34px;text-align:center;
  font-size:11px;color:#394152;letter-spacing:.05em}
</style></head><body><div class="pantalla">
  <div class="emblema">Α</div>
  <h1>Bienvenido a<br><b>Atenea Policial</b>.</h1>
  <div class="sub">Entra para seguir donde lo dejaste.</div>
  <label for="e">Correo</label>
  <div class="campo"><input id="e" placeholder="tu@correo.com"></div>
  <label for="c">Contraseña</label>
  <div class="campo"><input id="c" type="password" value="12345678">
    <button class="ojo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button class="enviar">Entrar</button>
  <div class="alt">¿Primera vez? <b>Crea tu cuenta</b></div>
  <div class="pie">45 temas del programa oficial</div>
</div></body></html>
