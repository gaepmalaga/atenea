<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>1 · Expediente</title>
<link rel="stylesheet" href="base.css"><style>
/* EXPEDIENTE. Papel, no cristal. La oposicion es papeleo y estudio, no una
   nave espacial: esto se parece a un documento oficial bien compuesto.
   Sin esquinas redondeadas, sin sombras, sin degradados. */
body{background:#f4f1ea;color:#1a1a1a;
  font-family:ui-serif,Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
.pantalla{padding:40px 28px;justify-content:center}
.sello{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:#8a2b2b;border:1.5px solid #8a2b2b;padding:6px 10px;
  display:inline-block;margin-bottom:34px;align-self:flex-start}
h1{font-size:46px;line-height:.95;letter-spacing:-.03em;font-weight:400;margin-bottom:10px}
h1 em{font-style:italic;color:#8a2b2b}
.sub{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#6b6559;margin-bottom:40px}
.regla{height:1.5px;background:#1a1a1a;margin-bottom:36px}
label{display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:#6b6559;margin-bottom:8px}
.campo{border-bottom:1.5px solid #c9c2b4;padding-bottom:11px;margin-bottom:28px;
  display:flex;align-items:center;gap:10px}
.campo:focus-within{border-color:#1a1a1a}
.campo input{font-size:17px;min-height:26px}
.campo input::placeholder{color:#b3ab9c}
.ojo{color:#8a8071;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin:-9px -10px -9px 0}
.enviar{width:100%;min-height:56px;background:#1a1a1a;color:#f4f1ea;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;margin-top:10px}
.pie{margin-top:auto;padding-top:44px;font-family:ui-monospace,'SF Mono',Menlo,monospace;
  font-size:10px;letter-spacing:.1em;color:#8a8071;display:flex;justify-content:space-between}
.pie b{font-weight:400;color:#8a2b2b;border-bottom:1px solid #8a2b2b}
</style></head><body><div class="pantalla">
  <div class="sello">Expediente · CNP</div>
  <h1>Atenea<br><em>Policial</em></h1>
  <div class="sub">Escala Básica · Acceso</div>
  <div class="regla"></div>
  <label for="e">Correo electrónico</label>
  <div class="campo"><input id="e" placeholder="tu@correo.com"></div>
  <label for="c">Contraseña</label>
  <div class="campo"><input id="c" type="password" value="12345678">
    <button class="ojo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button class="enviar">Acceder</button>
  <div class="pie"><span>45 temas · 898 preguntas</span><b>Crear cuenta</b></div>
</div></body></html>
